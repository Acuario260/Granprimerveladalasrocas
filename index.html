<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<title>PRIMERA GRAN VELADA DE BOX – LAS ROCAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="spot s1"></div><div class="spot s2"></div>

<!-- Introducción a pantalla completa -->
<div id="intro" class="intro">
  <div class="intro-in">
    <div class="title"><span>PRIMERA</span> GRAN VELADA</div>
    <p class="venue">DE BOX <b>◆</b> LAS ROCAS</p>
    <button id="enter" class="btn" type="button">Entrar con sonido</button>
    <button id="enterMute" class="link" type="button">Entrar sin sonido</button>
  </div>
</div>

<main class="stage" id="stage">
  <h1 class="title"><span>PRIMERA</span> GRAN VELADA</h1>
  <p class="venue">DE BOX <b>◆</b> LAS ROCAS</p>
  <div class="divider"><i></i><b></b><i></i></div>
  <p class="tagline">“El momento ha llegado. ¿Estás preparado?”</p>

  <section class="countdown" aria-label="Cuenta regresiva">
    <div class="box"><span id="d">00</span><small>Días</small></div>
    <div class="box"><span id="h">00</span><small>Horas</small></div>
    <div class="box"><span id="m">00</span><small>Minutos</small></div>
    <div class="box"><span id="s">00</span><small>Segundos</small></div>
  </section>

  <p class="date">8 DE NOVIEMBRE DE 2026 · 9:30&nbsp;A.&nbsp;M.<br><em>Perú · America/Lima (UTC-5)</em></p>
</main>

<section id="final" class="final" hidden>
  <div>
    <h2>¡LA PRIMERA<br>GRAN VELADA<br>HA COMENZADO!</h2>
    <p class="venue">DE BOX <b>◆</b> LAS ROCAS</p>
  </div>
</section>

<button id="snd" class="snd" type="button" aria-pressed="false" aria-label="Activar sonido">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M11 5 6 9H3v6h3l5 4z"/><g class="on"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g><g class="off"><path d="m16 9 6 6M22 9l-6 6"/></g>
  </svg>
</button>
<script src="script.js"></script>
</body>
</html>
